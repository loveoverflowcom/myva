[package]
name = "myva-graybox"
description = "Client graybox Bevy để thử combat của MyVa — Thần Mạch: native và nhúng web."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["gamepad"]
# gilrs: Gamepad API trên web; native Linux cần libudev-dev lúc build.
gamepad = ["bevy/bevy_gilrs"]

[dependencies]
myva-assets = { path = "../assets", default-features = false }
myva-gameplay = { path = "../gameplay" }
myva-sim = { path = "../sim" }
# Tập feature tối thiểu cho cảnh 2D, HUD chữ ASCII và ba loại input (ADR 0003); `png` giải mã
# atlas của fixture art D05-A trên cả native và web.
bevy = { version = "=0.20.0", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_color",
    "bevy_camera",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_window",
    "bevy_winit",
    "default_font",
    "keyboard",
    "touch",
    "gamepad",
    "png",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["webgl2"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["multi_threaded", "x11"] }

[lints]
workspace = true
