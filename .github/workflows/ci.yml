name: CI

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # gilrs (gamepad của graybox Bevy native) liên kết libudev trên Linux.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev
      - run: python3 scripts/check-docs.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked -p myva-web-shell -p myva-web-game -p myva-sim -p myva-gameplay --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace
      # Lõi mô phỏng phải build được cho web mà không kéo theo renderer.
      - run: cargo build -p myva-sim --target wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      # Cùng fixture: adapter ECS headless native và lõi WASM (Node) phải cùng hash từng tick.
      - run: ./scripts/check-wasm-determinism.sh 3600 1 7 12
      - run: ./scripts/build-web-shell.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-feasibility-evidence
          path: target/web-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-determinism-evidence
          path: target/wasm-determinism/report.json
