name: CI

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # gilrs (gamepad của graybox Bevy native) liên kết libudev trên Linux.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev
      # Actions owns provisioning; xtask never installs toolchains/dependencies/browsers.
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Single Surface Rule: the same planner as local full preflight, sequential builds.
      - run: cargo xtask ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-feasibility-evidence
          path: target/web-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-determinism-evidence
          path: target/wasm-determinism/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xtask-verification-evidence
          path: target/xtask-evidence
