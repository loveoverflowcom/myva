name: CI

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/check-docs.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked -p myva-web-shell -p myva-web-game --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace
      # Lõi mô phỏng phải build được cho web mà không kéo theo renderer.
      - run: cargo build -p myva-sim --target wasm32-unknown-unknown
      - run: ./scripts/build-web.sh
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: ./scripts/build-web-shell.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-feasibility-evidence
          path: target/web-evidence
