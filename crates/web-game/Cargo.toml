[package]
name = "myva-web-game"
description = "Bevy WASM entry for the MyVa combat graybox, embedded by the Leptos shell."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Feature Bevy do myva-graybox chọn (thêm webgl2 trên wasm32); crate này chỉ dựng cửa sổ canvas.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["bevy_winit", "bevy_window"] }
myva-graybox = { path = "../graybox" }
wasm-bindgen = "=0.2.129"

[lints]
workspace = true
